<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>404 Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 404 PREMIUM ANIMATIONS — scoped exclusively to .error-* classes -->
    <style>
        /* 1. Layout context for animated background */
        .error-layout {
            position: relative;
            overflow: hidden;
        }

        /* 2. Animated background radial orbs — extremely subtle */
        .error-bg-light {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .error-bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }

        .error-bg-orb-1 {
            width: 520px;
            height: 520px;
            top: -120px;
            left: 50%;
            background: radial-gradient(circle, rgba(15, 111, 255, 0.09) 0%, rgba(56, 189, 248, 0.04) 60%, transparent 100%);
            animation: eorb1 14s ease-in-out infinite alternate;
        }

        .error-bg-orb-2 {
            width: 300px;
            height: 300px;
            bottom: -80px;
            left: 25%;
            background: radial-gradient(circle, rgba(15, 111, 255, 0.06) 0%, transparent 70%);
            animation: eorb2 18s ease-in-out infinite alternate;
            animation-delay: -6s;
        }

        @keyframes eorb1 {
            0% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 0.55;
            }

            50% {
                transform: translateX(-50%) translateY(-24px) scale(1.04);
                opacity: 0.65;
            }

            100% {
                transform: translateX(-50%) translateY(8px) scale(0.97);
                opacity: 0.45;
            }
        }

        @keyframes eorb2 {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.35;
            }

            50% {
                transform: translateY(-18px) scale(1.06);
                opacity: 0.5;
            }

            100% {
                transform: translateY(10px) scale(0.95);
                opacity: 0.3;
            }
        }

        /* 3. Card wrapper — entrance animation + hover */
        .error-card-wrap {
            position: relative;
            z-index: 1;
            max-width: 550px;
            width: 100%;
            animation: ecard 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-card-wrap:hover {
            transform: translateY(-3px);
        }

        @keyframes ecard {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 4. Soft animated glow ring */
        .error-card-glow {
            position: relative;
            border-radius: 20px;
            padding: 2.5rem 2rem;
        }

        .error-card-glow::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 21px;
            pointer-events: none;
            animation: eglow 4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes eglow {

            0%,
            100% {
                box-shadow:
                    0 0 0 1px rgba(15, 111, 255, 0.06),
                    0 8px 32px rgba(15, 111, 255, 0.06);
            }

            50% {
                box-shadow:
                    0 0 0 1px rgba(15, 111, 255, 0.14),
                    0 8px 40px rgba(15, 111, 255, 0.12);
            }
        }

        /* 5. SVG illustration entrance */
        .error-illustration {
            animation: eillus 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
        }

        @keyframes eillus {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 6. Badge entrance */
        .error-badge-anim {
            display: inline-block;
            animation: ebadge 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
        }

        @keyframes ebadge {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 7. 404 heading — entrance + slow professional float */
        .error-404-heading {
            display: inline-block;
            animation:
                enum 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both,
                efloat 6s ease-in-out 1.1s infinite;
        }

        @keyframes enum {
            from {
                opacity: 0;
                transform: scale(0.84) translateY(12px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes efloat {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* 8. Body description entrance */
        .error-body-anim {
            animation: ebody 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        @keyframes ebody {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 9. Buttons row entrance */
        .error-btns-anim {
            animation: ebtns 0.55s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both;
        }

        @keyframes ebtns {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 10. Button hover lift */
        .error-btns-anim .btn {
            transition:
                transform 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                background-color 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .error-btns-anim .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 111, 255, 0.18);
        }

        /* 11. Reduced motion — full accessibility compliance */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                animation-delay: 0ms !important;
            }
        }

      /* 12. Mobile responsive */
@media (max-width: 900px) {

    .error-card-glow {
        padding: 2.5rem 1.5rem;
        width: 92%;
        max-width: 500px;
    }

    .error-bg-orb-1 {
        width: 380px;
        height: 380px;
    }
}


    </style>
</head>

<body>

    <!-- Preloader Overlay -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="preloader-graphics">
                <svg class="preloader-svg" viewBox="0 0 100 100" fill="none">
                    <path class="building-path"
                        d="M20 75 V45 H80 V75 M15 75 H85 M35 75 V45 M50 75 V45 M65 75 V45 M25 45 L50 25 L75 45"
                        stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="graph-path" d="M10 80 L30 60 L45 70 L70 45 L90 15" stroke="#0F6FFF" stroke-width="3.5"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="preloader-percentage-container">
                <span id="preloader-percent">0</span>
            </div>
            <div class="preloader-bar">
                <div id="preloader-progress" class="preloader-progress"></div>
            </div>
            <span class="preloader-title">FINANCIAL</span>
        </div>
    </div>

    <!-- Error Page Core Layout -->
    <div class="error-layout error-page-full">

        <!-- Animated background radial lights (aria-hidden, purely decorative) -->
        <div class="error-bg-light" aria-hidden="true">
            <div class="error-bg-orb error-bg-orb-1"></div>
            <div class="error-bg-orb error-bg-orb-2"></div>
        </div>

        <!-- 404 Card — animated entrance + hover -->
        <div class="error-card-wrap">
            <div class="error-card-glow">

                <!-- Broken Line Graph SVG Illustration -->
                <svg class="error-illustration" viewBox="0 0 200 160" fill="none" style="margin-bottom:2rem;">
                    <!-- Dotted Grid -->
                    <line x1="20" y1="20" x2="180" y2="20" stroke="#E2E8F0" stroke-dasharray="4 4" />
                    <line x1="20" y1="50" x2="180" y2="50" stroke="#E2E8F0" stroke-dasharray="4 4" />
                    <line x1="20" y1="80" x2="180" y2="80" stroke="#E2E8F0" stroke-dasharray="4 4" />
                    <line x1="20" y1="110" x2="180" y2="110" stroke="#E2E8F0" stroke-dasharray="4 4" />
                    <line x1="20" y1="140" x2="180" y2="140" stroke="#E2E8F0" stroke-dasharray="4 4" />
                    <!-- Broken Trend Line -->
                    <path d="M20 50 L60 80 L90 60 L120 110 M120 110 L150 140 L180 135" stroke="#64748B" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round" />
                    <!-- Broken Alert Warning Icon -->
                    <circle cx="120" cy="110" r="16" fill="#EF4444" />
                    <path d="M120 103 v9 M120 117 h.01" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
                    <!-- Financial Building Columns -->
                    <path
                        d="M40 140 H160 M50 140 V105 H150 V140 M65 140 V105 M85 140 V105 M105 140 V105 M125 140 V105 M50 105 L100 85 L150 105"
                        stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        opacity="0.4" />
                </svg>

                <!-- Badge -->
                <span class="badge badge-danger error-badge-anim" style="margin-bottom:1rem;">Index Allocation
                    Error</span>

                <!-- 404 heading — separate entrance + slow float -->
                <h1 class="error-404-heading"
                    style="font-family:var(--font-heading); font-size:2.8rem; font-weight:800; line-height:1.1; margin-bottom:1rem; color:var(--color-text-main);">
                    404 - Page Not Found</h1>

                <!-- Description -->
                <p class="card-desc error-body-anim"
                    style="font-size:1.05rem; margin-bottom:2rem; max-width:480px; margin-left:auto; margin-right:auto;">
                    The database or wealth folder route you seek cannot be allocated by our servers. This could be due
                    to a regulatory directory update or a modified URL structure.</p>

                <!-- Buttons -->
                <div class="error-btns-anim" style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
                    <a href="index.html" class="btn btn-outline back-home"><i data-lucide="home"
                            style="width:16px;"></i> Back to Home</a>
                    <a href="#" id="back-dashboard" class="btn btn-primary" style="display:none;">
                        <i data-lucide="layout" style="width:16px;"></i>
                        <span id="back-dashboard-text">Back to User Dashboard</span>
                    </a>
                </div>

            </div>
        </div>

    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const from = params.get("from");

            const backLink = document.querySelector("#back-dashboard");
            const backText = document.querySelector("#back-dashboard-text");
            const homeLink = document.querySelector(".back-home");

            if (from === "admin") {
                backLink.href = "dashboard-admin.html";
                backText.textContent = "Back to Admin Dashboard";
                backLink.style.display = "inline-flex";
            } else if (from === "user") {
                backLink.href = "dashboard-user.html";
                backText.textContent = "Back to User Dashboard";
                backLink.style.display = "inline-flex";
            } else {
                backLink.style.display = "none";
                if (homeLink) {
                    homeLink.className = "btn btn-primary back-home";
                }
            }

            // Re-initialize Lucide icons to draw the icon in the new link if visible
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
