<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | Finova Capital</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Core CSS Libraries -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- 1. Preloader Overlay -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="preloader-graphics">
                <svg class="preloader-svg" viewBox="0 0 100 100" fill="none">
                    <path class="building-path" d="M20 75 V45 H80 V75 M15 75 H85 M35 75 V45 M50 75 V45 M65 75 V45 M25 45 L50 25 L75 45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path class="graph-path" d="M10 80 L30 60 L45 70 L70 45 L90 15" stroke="#0F6FFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </div>
            <div class="preloader-percentage-container">
                <span id="preloader-percent">0</span>
            </div>
            <div class="preloader-bar">
                <div id="preloader-progress" class="preloader-progress"></div>
            </div>
            <span class="preloader-title">Finova Capital</span>
        </div>
    </div>

    <!-- Error Page Core Layout -->
    <div class="error-layout">
        <div class="reveal-hidden reveal-scale" style="max-width:550px;">
            <!-- Broken Line Graph SVG Illustration -->
            <svg class="error-illustration" viewBox="0 0 200 160" fill="none" style="margin-bottom:2rem;">
                <!-- Dotted Grid Grid -->
                <line x1="20" y1="20" x2="180" y2="20" stroke="#E2E8F0" stroke-dasharray="4 4" />
                <line x1="20" y1="50" x2="180" y2="50" stroke="#E2E8F0" stroke-dasharray="4 4" />
                <line x1="20" y1="80" x2="180" y2="80" stroke="#E2E8F0" stroke-dasharray="4 4" />
                <line x1="20" y1="110" x2="180" y2="110" stroke="#E2E8F0" stroke-dasharray="4 4" />
                <line x1="20" y1="140" x2="180" y2="140" stroke="#E2E8F0" stroke-dasharray="4 4" />
                
                <!-- Broken Trend Line -->
                <path d="M20 50 L60 80 L90 60 L120 110 M120 110 L150 140 L180 135" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Broken Alert Warning Icon -->
                <circle cx="120" cy="110" r="16" fill="#EF4444" />
                <path d="M120 103 v9 M120 117 h.01" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
                
                <!-- Financial Building Columns (Subdued Background) -->
                <path d="M40 140 H160 M50 140 V105 H150 V140 M65 140 V105 M85 140 V105 M105 140 V105 M125 140 V105 M50 105 L100 85 L150 105" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
            </svg>
            
            <span class="badge badge-danger" style="margin-bottom:1rem;">Index Allocation Error</span>
            <h1 style="font-family:var(--font-heading); font-size:2.8rem; font-weight:800; line-height:1.1; margin-bottom:1rem; color:var(--color-text-main);">404 - Page Not Found</h1>
            <p class="card-desc" style="font-size:1.05rem; margin-bottom:2rem; max-width:480px; margin-left:auto; margin-right:auto;">The database or wealth folder route you seek cannot be allocated by our servers. This could be due to a regulatory directory update or a modified URL structure.</p>
            
            <div style="display:flex; gap:1rem; justify-content:center;">
                <a href="index.html" class="btn btn-primary"><i data-lucide="home" style="width:16px;"></i> Return to Public Desk</a>
                <a href="contact.html" class="btn btn-outline"><i data-lucide="mail" style="width:16px;"></i> Consult Support</a>
            </div>
        </div>
    </div>

    <!-- Global Javascript libraries -->
    <script src="assets/js/main.js"></script>
</body>
</html>
